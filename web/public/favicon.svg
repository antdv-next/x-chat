<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <!-- Ceramic white bubble fill -->
    <linearGradient id="bubbleBg" x1="512" y1="100" x2="512" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="68%" stop-color="#F7F9FD"/>
      <stop offset="100%" stop-color="#EBF0F8"/>
    </linearGradient>

    <!-- Subtle highlight border -->
    <linearGradient id="bubbleStroke" x1="512" y1="100" x2="512" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#E2E8F0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Antdv Next A: Right leg (underneath fold) -->
    <linearGradient id="aRightGrad" x1="512" y1="300" x2="760" y2="710" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="30%" stop-color="#1677FF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Antdv Next A: Left leg + top ribbon crest (front) -->
    <linearGradient id="aLeftGrad" x1="256" y1="710" x2="545" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="56%" stop-color="#1677FF"/>
      <stop offset="100%" stop-color="#2CE0FF"/>
    </linearGradient>

    <!-- Antdv Next X: Back stroke (bottom-left to top-right: indigo -> orchid) -->
    <linearGradient id="xBackGrad" x1="436" y1="720" x2="588" y2="568" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B4EFF"/>
      <stop offset="52%" stop-color="#9656F5"/>
      <stop offset="100%" stop-color="#D666E8"/>
    </linearGradient>

    <!-- Antdv Next X: Front stroke (top-left to bottom-right: mint -> sky -> cobalt) -->
    <linearGradient id="xFrontGrad" x1="436" y1="568" x2="588" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#72F2DC"/>
      <stop offset="50%" stop-color="#57B8FF"/>
      <stop offset="100%" stop-color="#557DFF"/>
    </linearGradient>

    <!-- Soft ambient shadow for the ceramic bubble -->
    <filter id="bubbleShadow" x="40" y="40" width="944" height="960" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1E293B" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E293B" flood-opacity="0.06"/>
    </filter>

    <!-- Soft colored shadow for the A + x emblem -->
    <filter id="emblemShadow" x="140" y="160" width="744" height="680" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1677FF" flood-opacity="0.16"/>
    </filter>

    <!-- Mask to keep the front left-to-crest ribbon strictly inside the A arch silhouette -->
    <mask id="aArchMask" maskUnits="userSpaceOnUse" x="160" y="180" width="704" height="620">
      <path
        d="M 272 698 L 466 346 C 488 306 536 306 558 346 L 752 698"
        stroke="#FFFFFF"
        stroke-width="106"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </mask>
  </defs>

  <!-- Ceramic white sculpted speech bubble -->
  <g filter="url(#bubbleShadow)">
    <path
      d="M 308 108
         H 716
         C 826 108 908 190 908 300
         V 676
         C 908 786 826 868 716 868
         H 394
         L 284 948
         C 264 962 240 948 240 924
         V 858
         C 162 834 116 764 116 676
         V 300
         C 116 190 198 108 308 108 Z"
      fill="url(#bubbleBg)"
      stroke="url(#bubbleStroke)"
      stroke-width="6"
      stroke-linejoin="round"
    />
  </g>

  <!-- Brand Emblem: Antdv Next A arch + Antdv Next X nested small x -->
  <g filter="url(#emblemShadow)">
    <!-- Complete A arch with seamless ribbon fold -->
    <g mask="url(#aArchMask)">
      <!-- Base fill: right leg gradient -->
      <rect x="160" y="180" width="704" height="620" fill="url(#aRightGrad)"/>
      <!-- Front ribbon fold: left leg sweeping cleanly over the peak with an organic curved crease -->
      <path
        d="M 160 180 H 640 C 612 316 566 334 522 336 C 492 338 476 358 462 384 L 280 790 H 160 Z"
        fill="url(#aLeftGrad)"
      />
    </g>

    <!-- Small x: back bar (indigo -> orchid) -->
    <line
      x1="440" y1="718" x2="584" y2="574"
      stroke="url(#xBackGrad)"
      stroke-width="56"
      stroke-linecap="round"
    />

    <!-- Small x: front bar (mint -> sky -> cobalt) -->
    <line
      x1="440" y1="574" x2="584" y2="718"
      stroke="url(#xFrontGrad)"
      stroke-width="56"
      stroke-linecap="round"
    />
  </g>
</svg>
